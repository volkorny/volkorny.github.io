<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Standup Versions</title>
        <style>
            :root {
                --bg: #f4f5fb;
                --surface: #ffffff;
                --border: #e6e8f0;
                --text: #1f2433;
                --muted: #8a90a6;
                --accent: #6366f1;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                    Roboto, sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                padding: 32px 16px;
            }

            .container {
                max-width: 560px;
                margin: 0 auto;
            }

            h1 {
                font-size: 1.75em;
                font-weight: 650;
                letter-spacing: -0.02em;
                margin-bottom: 20px;
            }

            ul {
                list-style: none;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                overflow: hidden;
            }

            li + li {
                border-top: 1px solid var(--border);
            }

            a {
                display: flex;
                align-items: baseline;
                gap: 12px;
                padding: 14px 20px;
                color: inherit;
                text-decoration: none;
            }

            a:hover {
                background: #f8f8ff;
            }

            a:hover .version {
                color: var(--accent);
            }

            .version {
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                min-width: 28px;
            }

            .name {
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Standup</h1>
            <ul>
                <li><a href="v1.html"><span class="version">v1</span><span class="name">Daily Activity Tracker</span></a></li>
                <li><a href="v2.html"><span class="version">v2</span><span class="name">Daily Activity Tracker</span></a></li>
                <li><a href="v3.html"><span class="version">v3</span><span class="name">Daily Activity Planner</span></a></li>
                <li><a href="v4.html"><span class="version">v4</span><span class="name">Daily Activity Planner</span></a></li>
                <li><a href="v5.html"><span class="version">v5</span><span class="name">Daily Activity Planner</span></a></li>
            </ul>
        </div>
    </body>
</html>
